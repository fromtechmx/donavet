function login() {
  $('app').innerHTML = '<div class="login"><img class="logo" src="'+LOGO+'" alt="Dona Vet&amp;Care · Clínica Veterinaria" width="720" height="274"><h1 style="color:var(--navy);font-size:24px;margin:22px 0 0">Recepción</h1><p class="meta" style="margin:4px 0 0">Entra con tu correo y contraseña</p>' +
    '<input id="correo" type="email" placeholder="Correo" autocomplete="username" style="margin-top:14px">' +
    '<input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">' +
    '<button class="b p" style="width:100%" onclick="entrar()">Entrar</button></div>';
  ['correo', 'clave'].forEach(function (id) { var e = $(id); if (e) e.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') entrar(); }); });
}
function entrar() {
  var correo = ($('correo') || {}).value || '', pass = ($('clave') || {}).value || '';
  if (!correo.trim() || !pass) { aviso('Escribe tu correo y tu contraseña.', true); return; }
  $('app').innerHTML = '<div class="login"><p class="meta">Entrando…</p></div>';
  window.DV.entrar(correo, pass).then(function () { return abrirSesion(); }).catch(function (e) { login(); aviso(e && e.message || String(e), true); });
}
/** Con la sesión ya iniciada: trae el inicio y pinta la pantalla. */
function abrirSesion() {
  S.clave = 'sesion';
  return api('api_inicio', true).then(function (r) {
    if (!r.ok) { S.clave = ''; login(); aviso(r.error, true); return; }
    S.pend = r.pendientes || []; S.coin = r.coincidencias || {}; S.res = r.resumen; S.clinica = r.clinica || S.clinica; S.tally = r.tally || null; S.consN = r.consultasN || 0; S.estN = r.esteticaN || 0;
    S.usuario = r.resumen.personal[0] || ''; S.tab = 'res'; pintar();
  }).catch(function (e) { S.clave = ''; login(); aviso('No se pudo entrar: ' + (e && e.message || e), true); });
}
/** Al abrir la página: si ya hay sesión guardada en este navegador, entra solo; si no, muestra el inicio de sesión. */
function arrancar() {
  $('app').innerHTML = '<div class="login"><p class="meta">Cargando…</p></div>';
  window.DV.sesion().then(function (s) { if (s) abrirSesion(); else login(); }).catch(function () { login(); });
}
/** Una sola llamada al servidor: pendientes + posibles clientes existentes + resumen. */
function cargarPend() {
  return api('api_inicio').then(function (r) {
    if (!r.ok) { aviso(r.error, true); return; }
    S.pend = r.pendientes || []; S.coin = r.coincidencias || {}; S.res = r.resumen; S.tally = r.tally || null; S.consN = r.consultasN || 0; S.estN = r.esteticaN || 0;
    if (S.tab === 'pend') pintar();
  }).catch(function (e) { aviso('No se pudo actualizar: ' + (e && e.message || e), true); });
}
/* ---------- Recientes: los últimos pacientes revisados, a un toque (como la lista lateral de AVImark). Se guardan solo en esta pestaña del navegador. ---------- */
var REC_MAX = 8;
function recCargar() { try { var v = JSON.parse(sessionStorage.getItem('dv_recientes') || '[]'); return Array.isArray(v) ? v.filter(function (x) { return x && x.pk; }).slice(0, REC_MAX) : []; } catch (e) { return []; } }
function recGuardar() { try { sessionStorage.setItem('dv_recientes', JSON.stringify(S.rec)); } catch (e) { /* sin almacenamiento se usa solo en memoria */ } }
/** Un chip por paciente (cliente + mascota): la ficha y la consulta de la misma mascota son el mismo chip. */
function recKey(x) { return (x.cl || '') + ':' + (x.mid || ''); }
function recordar(it) {
  if (!S.rec) S.rec = recCargar();
  var k = recKey(it), previo = S.rec.filter(function (x) { return x.pk === k; })[0] || {};
  var e = { pk: k, cl: it.cl, mid: it.mid || '', m: it.m || previo.m || '', c: it.c || previo.c || '', cid: previo.cid || '', st: previo.st || '', p: previo.p || '', last: it.t };
  if (it.t === 'c') { if (previo.cid !== it.id) e.p = ''; e.cid = it.id; e.st = it.st || ''; if (it.p) e.p = it.p; } // la consulta se reabre en el paso donde se quedó
  S.rec = [e].concat(S.rec.filter(function (x) { return x.pk !== k && !(it.mid && !x.mid && !x.cid && String(x.cl) === String(it.cl)); })).slice(0, REC_MAX); // la ficha suelta del cliente se reemplaza por la de su mascota
  recGuardar();
}
function recActual() {
  if (S.tab === 'cons' && S.cons.vista === 'det' && S.cons.det) return (S.cons.det.consulta.idCliente || '') + ':' + (S.cons.det.consulta.idMascota || '');
  if (S.tab === 'busca' && S.cli && S.vista === 'mascota' && S.mascSel) return S.cli.cliente.id + ':' + S.mascSel.id;
  if (S.tab === 'busca' && S.cli && S.vista === 'cliente') return S.cli.cliente.id + ':';
  return '';
}
function recAbreConsulta(x) { return !!x.cid && (x.st === 'En curso' || x.last === 'c'); }
function htmlRecientes() {
  if (!S.rec) S.rec = recCargar();
  var l = S.rec, act = recActual(); if (!S.usuario || !l.length || !l.some(function (x) { return x.pk !== act; })) return '';
  return '<div class="rec-bar" role="navigation" aria-label="Pacientes recientes"><span>Recientes</span>' + l.map(function (x, i) {
    var on = x.pk === act, ab = recAbreConsulta(x), ener = ab ? 'consulta ' + x.cid + (x.st && x.st !== 'En curso' ? ' · ' + x.st : '') : 'ficha';
    return '<button type="button" class="rc-i ' + (x.cid && x.st === 'En curso' ? 'cons ' : '') + (on ? 'on' : '') + '" onclick="irAReciente(' + i + ')" title="' + esc((x.m || '') + ' · ' + (x.c || '') + ' · ' + ener) + '"><b>' + esc(x.m || x.c || '—') + '</b><small>' + esc((x.m && x.c ? x.c + ' · ' : '') + ener) + '</small></button>';
  }).join('') + '<button type="button" class="rc-x" onclick="recLimpiar()">Limpiar</button></div>';

/** Cantidad con letra para el pagaré: 1250.5 → "MIL DOSCIENTOS CINCUENTA PESOS 50/100 M.N." */
function numLetras(n) {

  var D = ['', '', '', 'TREINTA', 'CUARENTA', 'CINCUENTA', 'SESENTA', 'SETENTA', 'OCHENTA', 'NOVENTA'];
  var C = ['', 'CIENTO', 'DOSCIENTOS', 'TRESCIENTOS', 'CUATROCIENTOS', 'QUINIENTOS', 'SEISCIENTOS', 'SETECIENTOS', 'OCHOCIENTOS', 'NOVECIENTOS'];

    return (t ? t + ' ' : '') + rr;

  n = Math.round((Number(n) + 1e-9) * 100) / 100; if (!isFinite(n) || n < 0 || n >= 1e9) return '';

 * ===================================================================================================================== */

}
function admBloquear(msg) {

  if (S.ti) { var pr = S.ti.pr; if (pr) { pr.cp = null; pr.pg = null; pr.pv = null; pr.rs = null; } cosCerrar(); }
  REP = null;

    if (r.requiereConfirmacion && !datos.aceptarFuera) { // la cita se sale del horario de estética: se pregunta antes de apartar la hora
      a.guardando = false; pintar(); dlgConfirmar({ titulo: 'La cita queda fuera de horario', texto: r.error, si: 'Agendar de todos modos', no: 'Cancelar' }, function () { datos.aceptarFuera = true; agEnviar(datos); }); return;
    }
    a.guardando = false;
    if (!r.ok) { aviso(r.error, true); cargarAgenda(); return; } // vuelve a leer: casi siempre es porque alguien más ocupó o bloqueó esa hora
    agRecargar('Cita ' + r.id + ' agendada: ' + r.mascota + ', ' + fechaCorta(r.fecha) + ' a las ' + r.hora + (r.horas > 1 ? ' (' + r.horas + ' horas)' : '') + '.' + (r.aviso ? ' ' + r.aviso : ''));
  }).catch(function (e) { a.guardando = false; aviso('No se pudo agendar: ' + (e && e.message || e), true); pintar(); });
}
function agCancelar(id) {
  dlgPreguntar({ titulo: 'Cancelar la cita ' + id, etiqueta: 'Motivo (obligatorio)', obligatorio: 'Escribe el motivo de la cancelación.', si: 'Cancelar cita', no: 'Volver', peligro: true }, function (m) {
  api('api_cancelarCita', id, m, S.usuario).then(function (r) {
    if (!r.ok) { aviso(r.error, true); return; }
    agRecargar('Cita ' + id + ' cancelada. La hora quedó libre.' + (r.aviso ? ' ' + r.aviso : ''));
  }).catch(function (e) { aviso('No se pudo cancelar: ' + (e && e.message || e), true); });
  });
}
function agBloquear() {
  var a = agEstado(), sel = a.sel; if (a.guardando) return;
  a.guardando = true; pintar();
  api('api_bloquear', { fecha: sel.fecha, hora: sel.h, horas: Number(a.b.horas) || 1, motivo: a.b.motivo }, S.usuario).then(function (r) {
    a.guardando = false;
    if (!r.ok) { aviso(r.error, true); cargarAgenda(); return; }
    agRecargar('Horario bloqueado: ' + (r.tramos || []).join(', ') + '.');
  }).catch(function (e) { a.guardando = false; aviso('No se pudo bloquear: ' + (e && e.message || e), true); pintar(); });
}
function agBloquearDia(fecha) {
  dlgPreguntar({ titulo: 'Bloquear todo el día', texto: fechaLarga(fecha).replace(/ de \d{4}$/, ''), etiqueta: 'Motivo (opcional, por ejemplo: día festivo)', si: 'Bloquear el día' }, function (m) {
  api('api_bloquear', { fecha: fecha, todoElDia: true, motivo: String(m).trim() }, S.usuario).then(function (r) {
    if (!r.ok) { aviso(r.error, true); return; }
    agRecargar('Día bloqueado: ' + (r.tramos || []).join(', ') + '.');
  }).catch(function (e) { aviso('No se pudo bloquear: ' + (e && e.message || e), true); });
  });
}
function agQuitarBloqueo(id) {
  api('api_desbloquear', id, S.usuario).then(function (r) {
    if (!r.ok) { aviso(r.error, true); cargarAgenda(); return; }
    agRecargar('Bloqueo quitado.');
  }).catch(function (e) { aviso('No se pudo quitar el bloqueo: ' + (e && e.message || e), true); });
}
/* Las listas desplegables cortas (2 a 8 opciones) se muestran como cuadros para tocar. El <select> original queda oculto y sigue guardando el valor,
   así que todo el código que lo lee o reacciona a su cambio funciona igual. Las listas largas (ciudades, razas, productos) y el selector «Atiende» se quedan como lista. */
var CUADROS_MAX = 8;
function cuadrosDe() {
  [].forEach.call(document.querySelectorAll('select:not([data-cuad]):not([data-nocuad])'), function (sel) {
    var ops = [].slice.call(sel.options), vals = ops.filter(function (o) { return o.value !== ''; }), vacia = ops.filter(function (o) { return o.value === ''; })[0];
    if (vals.length < 1 || (vals.length > CUADROS_MAX && !sel.getAttribute('data-cuadros')) || !sel.parentNode) return;
    var g = document.createElement('div'); g.className = 'cuadros'; g.setAttribute('role', 'group'); if (sel.id) g.setAttribute('data-for', sel.id);
    var lab = sel.getAttribute('aria-label'); if (lab) g.setAttribute('aria-label', lab);
    var mk = function (txt, val, cls) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.setAttribute('data-v', val); if (cls) b.className = cls;
      b.onclick = function () { sel.value = val; sel.dispatchEvent(new Event('change', { bubbles: true })); cuadrosSync(sel); };
      g.appendChild(b);
    };
    vals.forEach(function (o) { mk(o.text, o.value, ''); });
    if (vacia) mk(/^[\s—\-]*elegir/i.test(vacia.text) || !vacia.text.trim() ? '—' : vacia.text.replace(/\s+/g, ' ').trim(), '', 'lim');
    sel.setAttribute('data-cuad', '1'); sel.parentNode.insertBefore(g, sel.nextSibling); cuadrosSync(sel);
  });
}
function cuadrosSync(sel) {
  var g = sel.nextSibling; if (!g || g.className.indexOf('cuadros') < 0) return;
  [].forEach.call(g.querySelectorAll('button'), function (b) { var v = b.getAttribute('data-v'), on = v === sel.value && v !== ''; b.className = on ? 'on' : (v === '' ? 'lim' : ''); });
}
document.addEventListener('change', function (e) { var t = e.target; if (t && t.tagName === 'SELECT' && t.getAttribute('data-cuad')) cuadrosSync(t); }, true);
try { new MutationObserver(function () { cuadrosDe(); }).observe(document.body, { childList: true, subtree: true }); } catch (e) { }
arrancar();
</script>
